# ==============================================================================
# Pipeline Name: ansible-validation-ci.yml
# Description: Continuous Integration quality assurance framework for Ansible.
#              Triggers automatically on code submission events to verify code.
# ==============================================================================

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: python_version
    value: '3.11'

stages:
  - stage: LintAndValidate
    displayName: 'Ansible Code Analysis'
    jobs:
      - job: RunAnsibleLint
        displayName: 'Execute Verification Suites'
        steps:
          # Bind stable runtime environments for testing dependencies
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(python_version)'
            displayName: 'Set Python Runtime Layer'

          # Provision official static syntax validation utilities
          - script: |
              python -m pip install --upgrade pip
              pip install ansible ansible-lint
            displayName: 'Install Playbook Validation Binaries'

          # Verify syntax, deprecated parameters, and security violations
          - script: |
              ansible-lint playbooks/
            displayName: 'Execute Playbook Linting Matrix'

          # Confirm fundamental compilation logic is intact without target node connectivity
          - script: |
              find playbooks/ -name "*.yml" -exec ansible-playbook --syntax-check {} +
            displayName: 'Run Playbook Syntax Audits'
